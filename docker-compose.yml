name: order-service
services:

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderservice-network

  order-service:
    build: .
    container_name: order-service
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: order_user
      DB_PASSWORD: order_pass
      USER_SERVICE_URL: http://host.docker.internal:8080
    ports:
      - "8081:8081"
    networks:
      - orderservice-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  order-db-data:

networks:
  orderservice-network:
    driver: bridge